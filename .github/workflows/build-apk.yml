
name: Build KontakFilter APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find source ZIP
        id: source
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP tidak ditemukan di folder utama."
            exit 1
          fi

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Source ZIP: $ZIP_FILE"

      - name: Extract ZIP
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q "${{ steps.source.outputs.zip_file }}" -d extracted

          SETTINGS_FILE="$(find extracted -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: File settings.gradle tidak ditemukan."
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK command-line tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip

          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd /tmp

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O android-tools.zip

          mkdir -p android-tools
          unzip -q android-tools.zip -d android-tools

          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          cp -r android-tools/cmdline-tools/. \
            "$HOME/android-sdk/cmdline-tools/latest/"

          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true

          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Collect APK
        shell: bash
        run: |
          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/*/*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/KontakFilter-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KontakFilter-debug-apk
          path: output/KontakFilter-debug.apk
          if-no-files-found: error
